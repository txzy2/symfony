services:
  sy_db:
    image: ${PGSQL_VERSION}
    restart: always
    container_name: ${PROJECT_NAME}_db
    tty: true
    volumes:
      - ./dbdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    networks:
      - sy_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  sy_adminer:
    image: ${ADMINER_VERSION}
    container_name: ${PROJECT_NAME}_adminer
    restart: always
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - sy_net

  sy_redis:
    image: redis:latest
    container_name: ${PROJECT_NAME}_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./reddata:/data
    networks:
      - sy_net

  sy_supervisor:
    build:
      context: .
      dockerfile: supervisor/Dockerfile
    container_name: ${PROJECT_NAME}_supervisor
    restart: always
    volumes:
      - ./:/var/www
      - ./supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./supervisor/logs:/var/log/supervisor
    depends_on:
      sy_db:
        condition: service_healthy
      sy_redis:
        condition: service_started
    networks:
      - sy_net

  sy_nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME}_nginx
    restart: always
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./:/var/www
      - ./nginx/logs/:/var/log/nginx
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - sy_app
    networks:
      - sy_net

  sy_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}_app
    restart: always
    volumes:
      - ./:/var/www
    depends_on:
      sy_db:
        condition: service_healthy
      sy_redis:
        condition: service_started
    networks:
      - sy_net

networks:
  sy_net:
    driver: bridge
