monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - requests
        - tokens

when@dev:
    monolog:
        handlers:
            requests:
                type: rotating_file
                path: "%kernel.logs_dir%/requests.log"
                level: info
                channels: [ "requests" ]
                filename_format: "{date}/requests"
                date_format: "Y/m/d"
            tokens:
                type: rotating_file
                path: "%kernel.logs_dir%/tokens.log"
                level: info
                channels: [ "tokens" ]
                filename_format: "{date}/tokens"
                date_format: "Y/m/d"
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: [ "!event" ]
                filename_format: "{date}/dev"
                date_format: "Y/m/d"
            console:
                type: console
                process_psr_3_messages: false
                channels: [ "!event", "!doctrine", "!console" ]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [ 404, 405 ]
                channels: [ "!event" ]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [ 404, 405 ]
                channels: [ "!deprecation" ]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: [ "!event", "!doctrine" ]
            deprecation:
                type: stream
                channels: [ deprecation ]
                path: php://stderr
                formatter: monolog.formatter.json
